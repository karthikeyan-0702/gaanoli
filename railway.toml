# GaanOli on Railway — API + web UI on ONE hostname (works behind Sophos)
# After deploy, set WEB_URL and API_URL to your Railway public URL

[build]
builder = "nixpacks"
buildCommand = """
npm run build --workspace=@gatube/shared && \
VITE_USE_RELATIVE_API=true VITE_PRIVACY_MODE=true npm run build --workspace=@gatube/web && \
npm run build --workspace=@gatube/api
"""

[deploy]
startCommand = "npm run start --workspace=@gatube/api"
healthcheckPath = "/health/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
